name: Build ArtisanKRNL SuSFS Branch

on:
  workflow_dispatch:
    inputs:
      device_code:
        description: 'رمز الجهاز (y2slte للـ 4G أو y2sxxx للـ 5G)'
        required: true
        default: 'y2slte'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Checkout SuSFS Branch
        uses: actions/checkout@v4
        with:
          ref: susfs
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libarchive-tools python3

      - name: Build Kernel
        run: |
          chmod +x build.sh
          ./build.sh -m ${{ github.event.inputs.device_code }} -k y -c n

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanKRNL-SuSFS-${{ github.event.inputs.device_code }}
          path: build/out/${{ github.event.inputs.device_code }}/*.zip

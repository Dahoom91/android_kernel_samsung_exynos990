name: Build ArtisanKRNL bpf111 + SuSFS

on:
  workflow_dispatch:
    inputs:
      device_code:
        description: 'Device code (y2sxxx for SM-G986B)'
        required: true
        default: 'y2sxxx'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Checkout Latest Branch (bpf111)
        uses: actions/checkout@v4
        with:
          ref: bpf111
          fetch-depth: 0
          submodules: recursive

      - name: Merge SuSFS Commits from susfs Branch
        run: |
          git config user.name "Builder"
          git config user.email "builder@github.com"
          git fetch origin susfs
          SUSFS_COMMIT=$(git log origin/susfs --grep="susfs" -i -n 1 --format="%H")
          if [ -n "$SUSFS_COMMIT" ]; then
            echo "Found SuSFS commit: $SUSFS_COMMIT"
            git cherry-pick -X theirs $SUSFS_COMMIT || true
          else
            git merge origin/susfs --no-commit --no-ff -X theirs || true
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libarchive-tools python3

      - name: Build Kernel
        run: |
          chmod +x build.sh
          ./build.sh -m ${{ github.event.inputs.device_code }} -k y

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanKRNL-bpf111-SuSFS-${{ github.event.inputs.device_code }}
          path: build/out/${{ github.event.inputs.device_code }}/*.zip
